
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Organize and manage your daily tasks with Task Manager.">

  <title>Task Manager</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="app-header">
    <h1>Task Manager</h1>
    <p>Organize your tasks and stay productive.</p>
  </header>

  <main class="app-container">

    <!-- Add Task Section -->
    <section class="task-form-section" aria-labelledby="form-heading">

      <h2 id="form-heading">Add a New Task</h2>

      <form id="task-form">

        <div class="form-group">
          <label for="task-input">Task Description</label>

          <input
            type="text"
            id="task-input"
            placeholder="Enter a new task"
            required
          >
        </div>

        <div class="form-group">
          <label for="task-category">Category</label>

          <select id="task-category" required>
            <option value="" disabled selected>
              Select a category
            </option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="Study">Study</option>
          </select>
        </div>

        <div class="form-group">
          <label for="task-due-date">Due Date (Optional)</label>

          <input
            type="date"
            id="task-due-date"
          >
        </div>

        <button type="submit" class="add-task-btn">
          Add Task
        </button>

      </form>

    </section>

    <!-- Task List Section -->
    <section class="task-list-section" aria-labelledby="tasks-heading">

      <h2 id="tasks-heading">My Tasks</h2>

      <!-- Task Filters -->
      <div
        id="task-filters"
        class="task-filters"
        role="group"
        aria-label="Filter tasks"
      >
        <button type="button" data-filter="all">
          All
        </button>

        <button type="button" data-filter="active">
          Active
        </button>

        <button type="button" data-filter="completed">
          Completed
        </button>
      </div>

      <!-- Tasks -->
      <ul id="task-list" aria-label="Task list"></ul>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
